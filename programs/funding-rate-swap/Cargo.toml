[package]
name = "funding-rate-swap"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "funding_rate_swap"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.31.1", features = ["token"] }
# Version pins to avoid edition2024 crates incompatible with Solana platform-tools Cargo 1.84
zeroize = { version = ">=1.3, <1.8", default-features = false }
digest = { version = ">=0.9, <0.11", default-features = false }

