[toolchain]
package_manager = "yarn"
solana_version = "2.3.13"

[features]
resolution = true
skip-lint = false

[programs.localnet]
funding_rate_swap = "EeQyJqzDEMYBSFJt7mwRkKgy5HFMGJQ3as6eKgxH8NUC"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/deploy-keypair.json"

[scripts]
test = "ANCHOR_PROVIDER_URL=https://api.devnet.solana.com ANCHOR_WALLET=$HOME/.config/solana/deploy-keypair.json yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
